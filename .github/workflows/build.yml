name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * 1" # 매주 한 번 서명 키 캐시를 건드려 지워지지 않게 함

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

env:
  SHERPA_VERSION: v1.13.8
  SHERPA: https://github.com/k2-fsa/sherpa-onnx/releases/download

jobs:
  # 휴대폰이 처음 실행할 때 내려받을 인식 모델을 이 저장소 릴리스 'models'에 한 번만 올린다.
  models:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Publish model files (once)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          if gh release view models -R "$R" >/dev/null 2>&1; then
            echo "models release already exists"; exit 0
          fi
          set -euo pipefail
          mkdir m && cd m
          pick() { find "$1" -name "$2" | head -1; }
          for n in tiny base small; do
            curl -fsSL "$SHERPA/asr-models/sherpa-onnx-whisper-$n.tar.bz2" | tar xj
            d="sherpa-onnx-whisper-$n"
            cp "$(pick $d '*encoder.int8.onnx')" "whisper-$n-encoder.int8.onnx"
            cp "$(pick $d '*decoder.int8.onnx')" "whisper-$n-decoder.int8.onnx"
            cp "$(pick $d '*tokens.txt')" "whisper-$n-tokens.txt"
            rm -rf "$d"
          done
          curl -fsSL "$SHERPA/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2" | tar xj
          d=$(ls -d sherpa-onnx-sense-voice*)
          cp "$(pick $d 'model*.onnx')" sense-voice-model.int8.onnx
          cp "$(pick $d 'tokens.txt')" sense-voice-tokens.txt
          rm -rf "$d"
          curl -fsSL -o wespeaker_en_voxceleb_resnet34.onnx "$SHERPA/speaker-recongition-models/wespeaker_en_voxceleb_resnet34.onnx"
          ls -la
          sha256sum * > SHA256SUMS
          gh release create models -R "$R" --latest=false --title "Models (on-device speech recognition)" \
            --notes "Files repackaged from k2-fsa/sherpa-onnx releases (Whisper int8, SenseVoice int8, WeSpeaker). The SubVivo app downloads them on first use." \
            ./*

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 서명 키: 저장소에 넣지 않고 Actions 캐시에만 보관 (처음 빌드 때 한 번 생성)
      - name: Restore signing key
        id: signing
        uses: actions/cache@v4
        with:
          path: .signing
          key: subvivo-signing-v1

      - name: Create signing key (first build only)
        if: steps.signing.outputs.cache-hit != 'true'
        run: |
          mkdir -p .signing
          openssl rand -hex 24 > .signing/pass
          P="$(cat .signing/pass)"
          keytool -genkeypair -keystore .signing/subvivo.jks -alias subvivo -keyalg RSA -keysize 2048 \
            -validity 36500 -storepass "$P" -keypass "$P" -dname "CN=SubVivo, O=SDarquiLAB, C=ES"

      - name: Stop here on weekly keep-alive
        if: github.event_name == 'schedule'
        run: echo "signing key cache refreshed"

      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'schedule'
        with:
          gradle-version: "8.14.3"

      - name: Native libraries and VAD model
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail
          curl -fsSL "$SHERPA/$SHERPA_VERSION/sherpa-onnx-$SHERPA_VERSION-android.tar.bz2" | tar xj
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          cp jniLibs/arm64-v8a/libsherpa-onnx-jni.so jniLibs/arm64-v8a/libonnxruntime.so app/src/main/jniLibs/arm64-v8a/
          curl -fsSL -o app/src/main/assets/silero_vad.onnx "$SHERPA/asr-models/silero_vad.onnx"
          ls -la app/src/main/jniLibs/arm64-v8a app/src/main/assets

      - name: Build APK
        if: github.event_name != 'schedule'
        run: |
          export SIGNING_STORE="$PWD/.signing/subvivo.jks"
          export SIGNING_PASS="$(cat .signing/pass)"
          gradle assembleRelease --stacktrace --no-daemon

      - name: Publish APK
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk SubVivo.apk
          ls -la SubVivo.apk
          gh release delete apk -R "$R" -y --cleanup-tag || true
          gh release create apk -R "$R" --latest --target "$GITHUB_SHA" \
            --title "SubVivo for Android (build $GITHUB_RUN_NUMBER)" \
            --notes "휴대폰에서 아래 SubVivo.apk 를 눌러 내려받아 설치하세요. (build $GITHUB_RUN_NUMBER, ${GITHUB_SHA::7})" \
            SubVivo.apk
